[alembic]
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://aicm:aicm_dev_password@localhost:5432/aicm

# Phase 2 T2.1 — multi-branch (shared / kms / agent) version locations.
# 기존 alembic/versions 는 *legacy linear history* (001..081) 보관소로 유지 —
# 호환을 위해 *반드시* 포함. 신규 branch 별 root 는 하위 폴더에 분리.
# path_separator = space: explicit separator (alembic 1.13+) — DeprecationWarning 회피.
path_separator = space
version_locations = alembic/versions alembic/versions/shared alembic/versions/kms alembic/versions/agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
