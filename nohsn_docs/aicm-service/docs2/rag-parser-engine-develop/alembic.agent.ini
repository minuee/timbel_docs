; Phase 2 T2.2 — Lucas-Agent alembic config (shared + agent branch only).
;
; 사용법:
;   alembic -c alembic.agent.ini upgrade agent@head

[alembic]
script_location = alembic_agent
sqlalchemy.url = postgresql+asyncpg://aicm:aicm_dev_password@localhost:5432/aicm

path_separator = space
version_locations = alembic/versions alembic/versions/shared alembic/versions/agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
