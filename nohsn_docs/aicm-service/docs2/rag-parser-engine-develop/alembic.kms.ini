; Phase 2 T2.2 — Lucas-KMS alembic config (shared + kms branch only).
;
; 사용법:
;   alembic -c alembic.kms.ini upgrade kms@head
;
; ``kms@head`` 라벨을 명시해야 함 — ``kms_root.depends_on=("shared",)`` 로 alembic
; 이 shared 도 자동 동반 적용. agent 모듈은 metadata 미등록이므로 ``alembic
; upgrade head`` 도 안전하지만 명시 권장.

[alembic]
script_location = alembic_kms
sqlalchemy.url = postgresql+asyncpg://aicm:aicm_dev_password@localhost:5432/aicm

; 기존 alembic/versions 의 linear history 와 신규 shared/kms branch root 만
; 인식. agent 폴더는 일부러 제외.
path_separator = space
version_locations = alembic/versions alembic/versions/shared alembic/versions/kms

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
