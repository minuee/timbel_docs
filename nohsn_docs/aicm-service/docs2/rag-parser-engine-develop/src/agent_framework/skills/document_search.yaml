skill:
  id: document_search
  version: "1.1"
  domain: kms
  description: "KMS 문서 검색 (BGE-M3 + reranker)"

availability:
  scope: all
  visibility: auto

triggers:
  - intent: search_document

slots:
  - name: query
    type: text
    required: true
  - name: top_k
    type: number

initial_state: greet
states:
  - id: greet
    on_enter:
      llm_respond:
        template: document_search_greet_on_enter.md
    transitions:
      - when: has_intent(search_document)
        to: collect
      - llm_fallback: true

  - id: collect
    llm_slot_fill: [query, top_k]
    transitions:
      - when: slot_filled(query)
        to: search
      - llm_fallback: true

  - id: search
    tool: kms_rag.search
    tool_args:
      query: $query
      top_k: 5
      tenant_id: $tenant_id
    on_exit:
      llm_respond:
        template: document_search_search_on_exit.md
    transitions:
      - to: done

  - id: done
