skill:
  id: medication_tracker
  version: "2.0"
  domain: medical
  description: "약 복용 알람 등록 — 매일 / 매주 / 격일 주기 reminder. 시니어·환자가 '매일 오전 8시 혈압약 먹게 해줘' 처럼 복용 일정 자동 알림 요청 시 사용."

availability:
  scope: personal
  visibility: auto

triggers:
  - intent: medication_tracker
  - intent: set_reminder

trigger_examples:
  - "매일 오전 8시에 혈압약 먹게 해줘"
  - "매일 저녁 9시 약 알람 등록해줘"
  - "매주 월요일 오전 9시 영양제 먹는다고 알려줘"
  - "혈압약 복용 알람 매일 8시"
  - "매일 아침 약 알람 만들어줘"

role:
  persona: "복약 알람 도우미. 약 이름·시각·주기 받고 reminder 등록."
  tone: "친절한 존댓말. 핵심만 간결히."
  knowledge_scope:
    - 복용
    - 알람
    - 리마인더
    - 약
  safety_constraints:
    - 의학적 조언/처방은 하지 않는다 (등록·알림만 담당).
    - 시각·주기가 모호하면 추측 없이 사용자에게 되묻는다.

slots:
  - name: medication_name
    type: text
    required: true
    description: "약 이름 (예: 혈압약 / 영양제 / 비타민D)"
  - name: time
    type: text
    required: true
    description: "복용 시각 HH:MM (예: 08:00, 21:00)"
  - name: recurrence_kind
    type: enum
    values: [daily, weekly, every_n_days]
    required: true
    description: "주기 종류 — daily | weekly | every_n_days"
  - name: weekday
    type: text
    description: "weekly 일 때 요일 (mon/tue/.../sun 또는 월/화/...)"
  - name: every_n
    type: number
    description: "every_n_days 일 때 N (예: 2 → 격일)"
  - name: phone
    type: phone
    source: identity

initial_state: greet
states:
  - id: greet
    transitions:
      - when: has_intent(medication_tracker) or has_intent(set_reminder)
        to: collect
      - llm_fallback: true

  - id: collect
    on_enter:
      llm_respond:
        template: medication_tracker_collect.md
    llm_slot_fill: [medication_name, time, recurrence_kind, weekday, every_n]
    transitions:
      - when: slots_filled(medication_name, time, recurrence_kind)
        to: register
      - llm_fallback: true

  - id: register
    tool: reminder.schedule
    tool_args:
      title: $medication_name
      template: $medication_name
      tenant_id: $personal_tenant_id
      phone: $phone
      channel: in_app
      recurrence_kind: $recurrence_kind
      time: $time
      weekday: $weekday
      every_n: $every_n
    on_exit:
      llm_respond:
        template: medication_tracker_confirm.md
    transitions:
      - to: done

  - id: done
