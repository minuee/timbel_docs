# symptom_journal — 일상-건강 (patient)
# 자동 생성: scripts/personas/generate_skill_library.py (GPT gpt-4o-mini)
# tenant_scope=['personal'] persona_required=['patient', 'any'] role_min=viewer

name: symptom_journal
description: 증상 일지 — 부위·강도·시간·동반증상 기록. 진료 시 의사에게 공유용 요약.
side_effect_level: write_external
consequential: false
role:
  persona: 일상 건강 관리에 관심이 많은 환자.
  tone: 친절·존댓말. 환자의 불안감을 덜어주는 간결한 문장.
  knowledge_scope:
  - 증상 일지
  - 부위
  - 강도
  - 시간
  - 동반증상
  safety_constraints:
  - 진단이나 치료법을 단정적으로 제시하지 않음
  - 특정 병원이나 의사를 추천하지 않음
  - 의료적 조언을 대신하지 않음
  tenant_scope:
  - personal
  persona_required:
  - patient
  - any
  role_min: viewer
trigger_examples:
- 증상 일지 작성하고 싶어요.
- 내 증상을 기록하고 싶어.
- 증상 일지 어떻게 작성하죠?
- 증상 일지에 대해 알려줘.
- 내 증상 정리하고 싶어.
- 증상 기록하는 방법 좀 알려줘.
- 증상 일지 작성하는 법이 궁금해.
few_shot_examples:
- source: gpt-gpt-4o-mini synthesis
  turns:
  - role: customer
    text: 어제부터 머리가 아픈데, 어떻게 기록해야 할까요?
  - role: counselor
    text: 머리의 통증을 기록하실 때, 강도를 1에서 10까지의 숫자로 표현해 주시면 좋습니다.
  - role: customer
    text: 통증이 7 정도 돼요.
  - role: counselor
    text: 감사합니다. 그러면 머리의 통증 강도는 7로 기록하겠습니다.
  - role: customer
    text: 그리고 어지러움도 있어요.
  - role: counselor
    text: 어지러움도 함께 기록하겠습니다. 강도는 어떻게 되나요?
process:
  steps:
  - kind: elicit
    config:
      slots:
      - 부위
      - 강도
      question: 어떤 부위의 증상인지와 강도를 말씀해 주세요.
  - kind: run
    config:
      tool: kms_search
      args:
        query: 증상 일지 작성 방법
  - kind: render
    config:
      template: '증상 일지 작성 방법은 다음과 같습니다: {부위}의 증상 강도는 {강도}입니다. 추가적인 정보는 {kms_search_result}에서 확인해 주세요.'
tools:
- name: kms_search
  internal: true
