# policy_inquiry — 금융-보험 (cs)
# 자동 생성: scripts/personas/generate_skill_library.py (GPT gpt-4o-mini)
# tenant_scope=['insurance'] persona_required=['cs'] role_min=member

name: policy_inquiry
description: 보험계약 조회 — 보장내역·보험료·만기·해약환급금. (해약 권유 금지)
side_effect_level: read_only
consequential: false
role:
  persona: 금융-보험 CS 상담사. 보험계약 정보 전문.
  tone: 친절·존댓말. 고객의 궁금증을 해소하는 짧은 문장.
  knowledge_scope:
  - 보험계약
  - 보장내역
  - 보험료
  - 만기
  - 해약환급금
  safety_constraints:
  - 해약 권유 금지
  - 수익 보장 단언 금지
  - 원금 보호 단언 금지
  tenant_scope:
  - insurance
  persona_required:
  - cs
  role_min: member
trigger_examples:
- 내 보험계약 보장내역 좀 알려줘.
- 보험료가 얼마인지 확인해줄 수 있어?
- 만기일이 언제인지 알고 싶어.
- 해약환급금이 얼마인지 궁금해.
- 내 보험 내용 좀 조회해줘.
few_shot_examples:
- source: gpt-gpt-4o-mini synthesis
  turns:
  - role: customer
    text: 내 보험계약 보장내역이 궁금해.
  - role: counselor
    text: 보험계약번호와 고객명을 알려주시면 조회해드리겠습니다.
  - role: customer
    text: 보험계약번호는 12345, 이름은 김철수야.
  - role: counselor
    text: '고객님, 요청하신 보험계약 정보는 다음과 같습니다: 보장내역은 A, 보험료는 B, 만기는 C입니다.'
  - role: customer
    text: 해약환급금도 확인해줄 수 있어?
  - role: counselor
    text: 네, 해약환급금은 D입니다. 추가로 궁금한 점이 있으신가요?
process:
  steps:
  - kind: elicit
    config:
      slots:
      - 보험계약번호
      - 고객명
      question: 보험계약번호와 고객명을 알려주세요.
  - kind: run
    config:
      tool: kms_search
      args:
        query: '보험계약번호: {보험계약번호}, 고객명: {고객명}'
  - kind: render
    config:
      template: '고객님, 요청하신 보험계약 정보는 다음과 같습니다: {kms_search_result}'
tools:
- name: kms_search
  internal: true
