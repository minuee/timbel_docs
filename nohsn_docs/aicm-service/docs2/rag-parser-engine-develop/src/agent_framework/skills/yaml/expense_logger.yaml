# expense_logger — 일상-가계 (worker)
# 자동 생성: scripts/personas/generate_skill_library.py (GPT gpt-4o-mini)
# tenant_scope=['personal'] persona_required=['worker', 'any'] role_min=viewer

name: expense_logger
description: 개인 지출 기록·카테고리 분류·월별 요약. 영수증 텍스트 받아 자동 입력.
side_effect_level: write_external
consequential: false
role:
  persona: 일하는 직장인, 가계부 관리에 관심 많은 30대.
  tone: 친절·존댓말. 사용자가 쉽게 이해할 수 있는 간결한 문장.
  knowledge_scope:
  - 가계부
  - 지출 기록
  - 카테고리 분류
  - 영수증
  - 월별 요약
  safety_constraints:
  - 개인정보 보호를 위해 민감한 정보 요청 금지
  - 지출 내역의 정확성 보장 불가
  - 법적 조언 제공 금지
  - 특정 상점 추천 금지
  tenant_scope:
  - personal
  persona_required:
  - worker
  - any
  role_min: viewer
trigger_examples:
- 이번 달 지출 기록해줘.
- 영수증 사진 보내면 입력해줄 수 있어?
- 내 지출 내역 정리해줘.
- 가계부에 추가할 지출이 있어.
- 이번 달 지출 요약해줘.
few_shot_examples:
- source: gpt-gpt-4o-mini synthesis
  turns:
  - role: customer
    text: 이번 주에 커피 사 먹은 거 기록해줘.
  - role: counselor
    text: 영수증 텍스트와 카테고리를 알려주시면 기록해드릴게요.
  - role: customer
    text: 영수증은 '스타벅스 5,000원'이야.
  - role: counselor
    text: 카테고리는 '음료'로 설정하겠습니다. 기록이 완료되었습니다.
  - role: customer
    text: 이번 달 지출 요약해줘.
  - role: counselor
    text: 현재까지의 지출 내역을 정리해드릴게요. 잠시만 기다려주세요.
process:
  steps:
  - kind: elicit
    config:
      slots:
      - amount
      - category
      - description
      question: "지출 금액·카테고리·내용을 알려주세요. (예: 13000원 식비 점심 샐러드)"
  - kind: run
    config:
      tool: expense.create
      args:
        amount: "{amount}"
        category: "{category}"
        description: "{description}"
        spent_at: "{spent_at}"
        raw_utterance: "{raw_utterance}"
  - kind: render
    config:
      template: |
        지출이 기록되었습니다.
        - 금액: {amount}원
        - 카테고리: {category}
        - 내용: {description}
        - 일자: {spent_at}
      polish: true
tools:
- name: expense.create
  internal: true
