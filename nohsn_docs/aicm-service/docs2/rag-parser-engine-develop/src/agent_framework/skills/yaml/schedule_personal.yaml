# schedule_personal — 개인 일정 등록·조회 (worker/student/any)
# PR-H2 후속 — v2 카탈로그 (auto_loader.select_skill) 가 후보로 인식하도록 v2
# 형식 yaml 신규 작성. v1 형식 (skills/schedule_personal.yaml) 은 PR-C state
# machine 정의로 유지하고 v2 yaml 은 select_skill 매칭용 메타만 보강.
# tenant_scope=['personal'] persona_required=['any'] role_min=viewer

name: schedule_personal
description: |
  개인 일정 등록·조회·삭제 전담 스킬. 약속·미팅·이벤트·회의 같은 *시각이 명시된*
  스케줄 관리. 사용자가 "등록·추가·잡아줘" 같은 행동 동사로 일정을 만들거나,
  "알려줘·보여줘·뭐 있어" 로 조회할 때 매칭. *brief 요약·todo 정리* 같은 generic
  업무 안내 (daily_briefing) 와 구분 — 이 스킬은 *구체적 일정 데이터의 CRUD*.
side_effect_level: write_external
consequential: false
retrieval: tool
role:
  persona: 개인 일정 도우미. 약속·미팅·이벤트 등록·조회·삭제 전담.
  tone: 친근한 존댓말. 핵심만 간결히.
  knowledge_scope:
  - 일정
  - 약속
  - 미팅
  - 스케줄
  - 캘린더
  safety_constraints:
  - 사용자 일정 정보를 외부에 공유하지 않는다.
  - 시각·장소가 모호하면 추측하지 않고 사용자에게 되묻는다.
  tenant_scope:
  - personal
  persona_required:
  - any
  role_min: viewer
trigger_examples:
- 내일 저녁 6시 약속 등록해줘
- 다음 주 화요일 미팅 추가
- 오늘 일정 알려줘
- 이번주 일정 보여줘
- 내일 뭐 있어?
- 약속 잡아줘
- 회의 일정 등록
- 3일 뒤 미팅 추가해줘
- 토요일 가족 모임 저장해줘
- 다음달 일정 조회
tools:
- schedule.create
- schedule.list
- schedule.delete
