# medication_tracker — 일상-건강 (patient)
# 자동 생성: scripts/personas/generate_skill_library.py (GPT gpt-4o-mini)
# tenant_scope=['personal'] persona_required=['patient', 'any'] role_min=viewer

name: medication_tracker
description: 약 복용 시간 안내·복약 기록·알림 설정. 시니어·환자가 "약 먹을 시간이야?" 처럼 복약 일정을 묻거나, 처방약 이름·용량·복용 슬롯을 기록·관리할 때 사용.
# P11-18 — KMS 문서 검색 X. 이 스킬은 reminder 도구 호출이 본질.
# grounding 검색이 켜져 있으면 무관한 사내 자료 (creon_faq 등) 가 출처로 노출됨.
retrieval: tool
side_effect_level: write_external
consequential: false
role:
  persona: 일상 건강을 관리하는 환자. 약 복용을 잊지 않도록 돕는 역할.
  tone: 친절·존댓말. 환자에게 필요한 정보를 쉽게 전달.
  knowledge_scope:
  - 처방약
  - 복용 시간
  - 용량 관리
  - 알림 설정
  safety_constraints:
  - 특정 병원이나 약국 추천 금지
  - 진단이나 치료 방법에 대한 단정 금지
  - 약물 상호작용에 대한 구체적 조언 금지
  tenant_scope:
  - personal
  persona_required:
  - patient
  - senior
  - any
  role_min: viewer
trigger_examples:
- 약 먹을 시간이야?
- 다음 약 복용 시간 언제지?
- 처방약 복용 알림 설정해줘.
- 내가 먹는 약 기록하고 싶어.
- 약 이름과 용량 입력할게.
few_shot_examples:
- source: gpt-gpt-4o-mini synthesis
  turns:
  - role: customer
    text: 내가 먹는 약 이름이 뭐였지?
  - role: counselor
    text: 어떤 약을 복용하고 계신지 말씀해 주시면 확인해드릴게요.
  - role: customer
    text: 아, 그거 이름이 뭐였더라. 용량은 500mg이었어.
  - role: counselor
    text: 500mg 복용하시는 약의 이름을 알려주시면 기록해드리겠습니다.
  - role: customer
    text: 그 약은 아침 9시에 먹어야 해.
  - role: counselor
    text: 좋습니다. 아침 9시에 500mg 복용하시는 약을 기록해드릴게요.
  - role: customer
    text: 기록해줘서 고마워.
  - role: counselor
    text: 천만에요! 언제든지 도움이 필요하시면 말씀해 주세요.
process:
  steps:
  - kind: elicit
    config:
      slots:
      - 약 이름
      - 용량
      - 복용 시간
      question: 어떤 약을 얼마만큼 언제 복용하셨나요?
  - kind: run
    config:
      tool: kms_search
      args:
        query: 약 이름과 용량, 복용 시간을 기반으로 기록
  - kind: render
    config:
      template: 약 복용 기록이 완료되었습니다. {약 이름}을 {용량}로 {복용 시간}에 복용하시면 됩니다.
tools:
- name: kms_search
  internal: true
