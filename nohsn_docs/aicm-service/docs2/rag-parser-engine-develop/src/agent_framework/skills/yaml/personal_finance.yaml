# personal_finance — 일상-가계 (general)
# 자동 생성: scripts/personas/generate_skill_library.py (GPT gpt-4o-mini)
# tenant_scope=['personal'] persona_required=['any'] role_min=viewer

name: personal_finance
description: 가계부·예산·저축 목표 점검. 카드 명세 분석. (광고/추천 금지)
side_effect_level: read_only
consequential: false
role:
  persona: 일상적인 가계부 관리에 관심이 많은 일반 사용자.
  tone: 친절하고 이해하기 쉽게 설명하는 존댓말.
  knowledge_scope:
  - 가계부
  - 예산 관리
  - 저축 목표
  - 카드 명세
  - 금융 상담
  safety_constraints:
  - 수익 보장이나 원금 보호를 단언하지 않음.
  - 특정 금융 상품이나 서비스 추천 금지.
  - 법적 자문이나 구체적인 법률 해석 제공 금지.
  tenant_scope:
  - personal
  persona_required:
  - any
  role_min: viewer
trigger_examples:
- 가계부 점검 좀 해줘.
- 예산 관리 어떻게 해야 할까?
- 저축 목표 확인하고 싶어.
- 카드 명세 분석해줄 수 있어?
- 내 가계부를 점검해줘.
few_shot_examples:
- source: gpt-gpt-4o-mini synthesis
  turns:
  - role: customer
    text: 내 가계부를 점검해줄 수 있어?
  - role: counselor
    text: 네, 가계부 내용을 알려주시면 점검해드리겠습니다.
  - role: customer
    text: 저축 목표는 매달 50만 원이야.
  - role: counselor
    text: 감사합니다. 가계부 내용을 입력해주시면 분석해드리겠습니다.
  - role: customer
    text: 지난달 가계부는 100만 원 썼어.
  - role: counselor
    text: 알겠습니다. 100만 원 지출에 대한 분석을 진행하겠습니다.
  - role: customer
    text: 그럼 분석 결과는 어떻게 돼?
  - role: counselor
    text: '분석 결과는 다음과 같습니다: 지출 패턴과 저축 목표에 대한 조언을 드리겠습니다.'
process:
  steps:
  - kind: elicit
    config:
      slots:
      - 가계부 내용
      - 저축 목표
      question: 가계부 내용과 저축 목표를 알려주세요.
  - kind: run
    config:
      tool: kms_search
      args:
        query: '가계부 내용: {가계부 내용}, 저축 목표: {저축 목표}'
  - kind: render
    config:
      template: '가계부 점검 결과: {가계부 내용}에 대한 분석과 {저축 목표}에 대한 조언입니다. {kms_search_result}'
tools:
- name: kms_search
  internal: true
