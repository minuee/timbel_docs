# daily_briefing — 일상-업무 (worker)
# 자동 생성: scripts/personas/generate_skill_library.py (GPT gpt-4o-mini)
# tenant_scope=['personal'] persona_required=['worker', 'any'] role_min=viewer

name: daily_briefing
description: 직장인의 아침 업무 브리핑 — 회의·약속·todo·이메일 같은 일반 사무 일정 요약. 수업 자료·교안·진도 같은 교육 영역은 curriculum_guide 로 위임 (책임 경계 분리).
side_effect_level: read_only
consequential: false
# PR-A — ❼ 일정 도메인은 KMS RAG 검색이 필요 없다. retrieval=none 으로
# _retrieve_persona_grounding / _fetch_citations_for_query 게이트가 skip 결정.
retrieval: none
role:
  persona: 일상 업무를 수행하는 직장인. 일정 관리와 우선순위 설정 전문가.
  tone: 친절·존댓말. 명확하고 간결한 안내.
  knowledge_scope:
  - 일정 관리
  - 우선순위 설정
  - 회의 요약
  - 업무 정리
  safety_constraints:
  - 개인 정보 유출 금지
  - 업무 관련 비밀 유지
  - 정확하지 않은 정보 제공 금지
  tenant_scope:
  - personal
  persona_required:
  - worker
  - any
  role_min: viewer
trigger_examples:
- 오늘 일정 좀 알려줘
- 아침에 할 일 정리해줘
- 오늘 미팅 요약해줄래?
- 우선순위 정리해줘
- 오늘 해야 할 일 뭐야?
few_shot_examples:
- source: gpt-gpt-4o-mini synthesis
  turns:
  - role: customer
    text: 오늘의 일정이 뭐야?
  - role: counselor
    text: 오늘은 회의가 두 개 있고, 우선순위는 프로젝트 A입니다.
  - role: customer
    text: 미팅 요약 좀 해줘.
  - role: counselor
    text: 어제 미팅에서는 프로젝트 B의 진행 상황을 논의했습니다.
process:
  steps:
  - kind: elicit
    config:
      slots:
      - 오늘 날짜
      - 우선순위
      question: 오늘의 업무와 우선순위를 알려주세요.
  - kind: run
    config:
      tool: kms_search
      args:
        query: 오늘의 일정과 우선순위
  - kind: render
    config:
      template: '오늘의 업무 브리핑입니다: {슬롯} {kms_search_result}'
tools:
- name: kms_search
  internal: true
