category: restaurant_cafe
label: "식당 & 카페"
description: "레스토랑·카페·베이커리·테이크아웃 매장의 SOP 인터뷰 질문."

# 카테고리 specific 질문. _common.yaml 의 공통 15 질문이 자동으로 추가된다.
questions:
  - id: rc_cuisine_type
    label: "메인 메뉴 / 요리 카테고리는 무엇인가요?"
    type: text
    example: "한식 / 일식 / 양식 / 카페·디저트 / 브런치"
    required: true
    section: 페르소나

  - id: rc_peak_hours
    label: "가장 바쁜 시간대 (피크) 는 언제인가요?"
    type: text
    example: "평일 점심 12-14시 / 주말 저녁 18-21시"
    required: true
    section: 응대 시나리오

  - id: rc_reservation_policy
    label: "예약 정책 — 단체 최소 인원 / 룸 / 노쇼 페널티 등."
    type: textarea
    example: "단체 6인 이상 사전 예약 / 룸 최소 이용 5만원 / 노쇼 시 다음 예약 거절"
    required: true
    section: 응대 시나리오

  - id: rc_allergy_handling
    label: "알레르기 / 식이 제한 (비건 등) 대응 정책은요?"
    type: textarea
    example: "주문 전 알레르기 사전 확인 필수. 견과·갑각·유제품 표기. 비건 메뉴 별도 안내."
    required: true
    section: 금지 사항

  - id: rc_delivery_takeout
    label: "배달 / 포장 운영 — 사용 플랫폼 / 가능 지역 / 최소 금액?"
    type: textarea
    example: "배달의민족 + 자체 / 반경 3km / 최소 1만 5천원"
    required: false
    section: 응대 시나리오
