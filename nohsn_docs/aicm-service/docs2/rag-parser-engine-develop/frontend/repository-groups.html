<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Locus-KMS — 저장소 그룹</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 1100px; margin: 30px auto; padding: 0 20px; color: #222; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 18px; }
    a.back { color: #4a90e2; text-decoration: none; font-size: 13px; }
    .toolbar { background: #f5f5f5; padding: 12px 14px; border-radius: 6px; margin: 14px 0 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar button { padding: 7px 14px; font-size: 13px; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; background: white; }
    .toolbar button.primary { background: #4a90e2; color: white; border-color: #4a90e2; }
    .toolbar button.primary:hover { background: #3978c2; }
    .toolbar button.danger { background: #d32f2f; color: white; border-color: #d32f2f; }
    .toolbar button.danger:hover { background: #b22222; }
    .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    .pane { border: 1px solid #e0e0e0; border-radius: 6px; padding: 14px 16px; background: #fafafa; }
    .pane h3 { font-size: 14px; margin: 0 0 10px; color: #444; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px; }
    #group-list { list-style: none; padding: 0; margin: 0; max-height: 480px; overflow-y: auto; }
    #group-list li { padding: 10px 12px; margin-bottom: 6px; border-radius: 4px; cursor: pointer; background: white; border: 1px solid #e8e8e8; }
    #group-list li:hover { background: #f0f4ff; border-color: #c5d8f5; }
    #group-list li.selected { background: #e8f0fe; border-color: #4a90e2; }
    #group-list .gname { font-weight: 600; font-size: 13px; color: #1a1a1a; }
    #group-list .gmeta { font-size: 11px; color: #777; margin-top: 3px; }
    #group-list .badge-default { display: inline-block; background: #4a90e2; color: white; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 4px; font-size: 12px; color: #555; }
    .field input[type=text], .field textarea { width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 13px; }
    .field textarea { min-height: 60px; resize: vertical; }
    .checkbox-list { max-height: 220px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; padding: 8px 10px; background: white; }
    .checkbox-list label { display: block; padding: 4px 0; font-size: 13px; cursor: pointer; }
    .checkbox-list label:hover { background: #f5f8ff; }
    .checkbox-list input[type=checkbox] { margin-right: 6px; vertical-align: middle; }
    .checkbox-list .repo-meta { color: #888; font-size: 11px; margin-left: 4px; }
    .toggle-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: white; border: 1px solid #ddd; border-radius: 4px; }
    .form-actions { margin-top: 16px; display: flex; gap: 8px; }
    .empty { padding: 30px; text-align: center; color: #999; font-size: 13px; }
    .status-banner { padding: 10px 14px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; display: none; }
    .status-banner.ok { background: #e8f5e9; border: 1px solid #4caf50; color: #1f7a3a; display: block; }
    .status-banner.err { background: #ffebee; border: 1px solid #f44336; color: #b71c1c; display: block; }
    .status-banner.info { background: #e3f2fd; border: 1px solid #4a90e2; color: #0a4a8a; display: block; }
  </style>
  <script src="config.js"></script>
  <script src="nav.js"></script>
</head>
<body>
  <a href="index.html" class="back">&larr; 메인</a>
  <h1>저장소 그룹</h1>
  <div class="subtitle">RepositoryGroup CRUD &mdash; 검색 scope 를 group 단위로 묶어 default 로 지정 가능</div>

  <div id="banner" class="status-banner"></div>

  <div class="toolbar">
    <button class="primary" onclick="newGroup()">+ 새 group</button>
    <button onclick="setDefault()" id="btn-default" disabled>기본 group 설정</button>
    <button class="danger" onclick="deleteGroup()" id="btn-delete" disabled>삭제</button>
    <span style="margin-left:auto; font-size:12px; color:#777;">tenant: <code id="tenant-display"></code></span>
  </div>

  <div class="layout">
    <div class="pane">
      <h3>Group 목록</h3>
      <ul id="group-list"><li class="empty" style="border:none; background:transparent;">불러오는 중...</li></ul>
    </div>

    <div class="pane">
      <h3 id="detail-title">상세</h3>
      <div id="detail-body">
        <div class="empty">좌측에서 group 을 선택하거나 [+ 새 group] 으로 신규 생성</div>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const tid = () => window.LUCAS_TENANT_ID;
    let groups = [];
    let repos = [];
    let selectedId = null;
    let isNew = false;

    document.getElementById('tenant-display').textContent = tid();

    function banner(kind, msg) {
      const el = $('banner');
      el.className = 'status-banner ' + kind;
      el.textContent = msg;
      if (kind === 'ok' || kind === 'info') setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    async function api(path, opts = {}) {
      const r = await fetch(window.LUCAS_API_BASE + path, {
        ...opts,
        headers: { 'X-Tenant-Id': tid(), ...(opts.headers || {}) },
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${JSON.stringify(data)}`);
      return data;
    }

    async function loadRepos() {
      try {
        const r = await api(`/api/v1/tenants/${tid()}/repositories?limit=100`);
        repos = r.data?.items || r.data || [];
      } catch (e) {
        banner('err', 'repository list 실패: ' + e.message);
        repos = [];
      }
    }

    async function loadGroups() {
      try {
        const r = await api(`/api/v1/tenants/${tid()}/repository-groups`);
        groups = r.data?.items || r.data || [];
        renderList();
      } catch (e) {
        banner('err', 'group list 실패: ' + e.message);
        groups = [];
        $('group-list').innerHTML = '<li class="empty" style="border:none; background:transparent;">조회 실패: ' + escapeHtml(e.message) + '</li>';
      }
    }

    function renderList() {
      const ul = $('group-list');
      if (!groups.length) {
        ul.innerHTML = '<li class="empty" style="border:none; background:transparent;">group 없음 &mdash; [+ 새 group] 으로 생성</li>';
        return;
      }
      ul.innerHTML = groups.map(g => `
        <li data-id="${g.id}" class="${selectedId === g.id ? 'selected' : ''}" onclick="selectGroup('${g.id}')">
          <div class="gname">${escapeHtml(g.name)}${g.is_default ? '<span class="badge-default">default</span>' : ''}</div>
          <div class="gmeta">${(g.repository_ids || []).length} repos${g.description ? ' &middot; ' + escapeHtml(g.description.slice(0, 40)) : ''}</div>
        </li>
      `).join('');
    }

    async function selectGroup(gid) {
      selectedId = gid;
      isNew = false;
      $('btn-delete').disabled = false;
      $('btn-default').disabled = false;
      renderList();
      try {
        const r = await api(`/api/v1/repository-groups/${gid}`);
        const g = r.data || r;
        renderDetail(g);
      } catch (e) {
        // fall back to list cache
        const g = groups.find(x => x.id === gid);
        if (g) renderDetail(g);
        else banner('err', '상세 조회 실패: ' + e.message);
      }
    }

    function newGroup() {
      selectedId = null;
      isNew = true;
      $('btn-delete').disabled = true;
      $('btn-default').disabled = true;
      renderList();
      renderDetail({ name: '', description: '', repository_ids: [], is_default: false });
    }

    function renderDetail(g) {
      $('detail-title').textContent = isNew ? '신규 group' : '상세 — ' + (g.name || '');
      const repoChecks = repos.map(r => {
        const checked = (g.repository_ids || []).includes(r.id) ? 'checked' : '';
        return `<label><input type="checkbox" value="${r.id}" ${checked}> ${escapeHtml(r.name)} <span class="repo-meta">(${r.document_count || 0} docs)</span></label>`;
      }).join('') || '<div class="empty">repo 없음</div>';

      $('detail-body').innerHTML = `
        <div class="field">
          <label>이름 *</label>
          <input type="text" id="f-name" value="${escapeHtml(g.name || '')}" placeholder="예: 정책 group">
        </div>
        <div class="field">
          <label>설명</label>
          <textarea id="f-desc" placeholder="이 group 의 용도/범위">${escapeHtml(g.description || '')}</textarea>
        </div>
        <div class="field">
          <label>저장소 선택 (multi-select)</label>
          <div class="checkbox-list" id="f-repos">${repoChecks}</div>
          <div style="font-size:11px; color:#888; margin-top:4px;">체크 해제 후 저장 시 해당 repo 제거</div>
        </div>
        <div class="field">
          <label>기본 group</label>
          <div class="toggle-row">
            <input type="checkbox" id="f-default" ${g.is_default ? 'checked' : ''}>
            <label for="f-default" style="margin:0; font-size:13px; cursor:pointer;">is_default &mdash; 검색 scope=default 시 이 group 사용 (tenant 당 1개만 가능)</label>
          </div>
        </div>
        <div class="form-actions">
          <button class="primary" onclick="saveGroup()">${isNew ? '생성' : '저장'}</button>
          ${isNew ? '<button onclick="cancelNew()">취소</button>' : ''}
        </div>
      `;
    }

    function cancelNew() {
      isNew = false;
      selectedId = null;
      $('detail-body').innerHTML = '<div class="empty">좌측에서 group 을 선택하거나 [+ 새 group] 으로 신규 생성</div>';
    }

    function collectForm() {
      const name = ($('f-name').value || '').trim();
      const description = ($('f-desc').value || '').trim();
      const checkedRepos = Array.from(document.querySelectorAll('#f-repos input[type=checkbox]:checked'))
        .map(c => c.value);
      const isDefault = $('f-default').checked;
      return { name, description, repository_ids: checkedRepos, is_default: isDefault };
    }

    async function saveGroup() {
      const payload = collectForm();
      if (!payload.name) return banner('err', '이름은 필수');
      try {
        if (isNew) {
          const r = await api(`/api/v1/tenants/${tid()}/repository-groups`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          banner('ok', '생성 완료');
          const newId = r.data?.id || r.id;
          isNew = false;
          await loadGroups();
          if (newId) await selectGroup(newId);
        } else {
          await api(`/api/v1/repository-groups/${selectedId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          banner('ok', '저장 완료');
          await loadGroups();
          await selectGroup(selectedId);
        }
      } catch (e) {
        banner('err', '저장 실패: ' + e.message);
      }
    }

    async function setDefault() {
      if (!selectedId) return;
      try {
        await api(`/api/v1/repository-groups/${selectedId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_default: true }),
        });
        banner('ok', '기본 group 으로 설정 (다른 group 의 is_default 는 backend 가 자동으로 false 처리)');
        await loadGroups();
        await selectGroup(selectedId);
      } catch (e) {
        banner('err', '기본 설정 실패: ' + e.message);
      }
    }

    async function deleteGroup() {
      if (!selectedId) return;
      const g = groups.find(x => x.id === selectedId);
      if (!confirm(`group "${g?.name || selectedId}" 을 삭제하시겠습니까? (repo 자체는 유지)`)) return;
      try {
        await api(`/api/v1/repository-groups/${selectedId}`, { method: 'DELETE' });
        banner('ok', '삭제 완료');
        selectedId = null;
        $('btn-delete').disabled = true;
        $('btn-default').disabled = true;
        $('detail-body').innerHTML = '<div class="empty">좌측에서 group 을 선택하거나 [+ 새 group] 으로 신규 생성</div>';
        await loadGroups();
      } catch (e) {
        banner('err', '삭제 실패: ' + e.message);
      }
    }

    function escapeHtml(s) { return String(s||'').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":"&#39;"}[c])); }

    (async () => {
      await loadRepos();
      await loadGroups();
    })();
  </script>
</body>
</html>
