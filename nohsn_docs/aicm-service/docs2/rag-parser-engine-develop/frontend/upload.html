<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Locus-KMS — 문서 업로드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    a.back { color: #4a90e2; text-decoration: none; font-size: 13px; }
    .tab-bar { border-bottom: 2px solid #e0e0e0; margin: 20px 0; }
    .tab-bar button { background: none; border: none; padding: 10px 20px; cursor: pointer; font-size: 15px; color: #777; }
    .tab-bar button.active { color: #1a1a1a; border-bottom: 2px solid #4a90e2; margin-bottom: -2px; font-weight: 600; }
    .panel { display: none; padding: 20px 0; }
    .panel.active { display: block; }
    .field { margin-bottom: 16px; }
    .field label { display: block; margin-bottom: 4px; font-size: 13px; color: #555; }
    .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
    .field textarea { min-height: 240px; font-family: ui-monospace, "SF Mono", monospace; }
    button.primary { background: #4a90e2; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button.primary:hover { background: #3978c2; }
    button.primary:disabled { background: #aaa; cursor: not-allowed; }
    .result { margin-top: 20px; padding: 16px; border-radius: 4px; font-size: 13px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
    .result.ok { background: #e8f5e9; border: 1px solid #4caf50; }
    .result.err { background: #ffebee; border: 1px solid #f44336; }
    .repo-select { margin-bottom: 20px; padding: 12px; background: #fffbe6; border-radius: 4px; }
  </style>
  <script src="config.js"></script>
  <script src="nav.js"></script>
</head>
<body>
  <a href="index.html" class="back">← 메인</a>
  <h1>문서 업로드</h1>

  <div class="repo-select">
    <label>저장소 (repo): </label>
    <select id="repo-select" style="padding: 4px 8px; font-size: 13px;"></select>
    <button onclick="loadRepos()" style="margin-left: 8px;">새로고침</button>
    <button onclick="createRepo()" style="margin-left: 4px;">+ 신규 repo</button>
  </div>

  <div class="tab-bar">
    <button class="active" onclick="setTab(this, 'file')">파일 업로드 (PDF/DOCX/MD)</button>
    <button onclick="setTab(this, 'note')">노트 수동 작성</button>
  </div>

  <div id="panel-file" class="panel active">
    <div class="field">
      <label>파일 선택</label>
      <input type="file" id="file-input" accept=".pdf,.docx,.md,.markdown,.html,.txt">
    </div>
    <div class="field">
      <label>제목 (선택 — 비우면 파일명)</label>
      <input type="text" id="file-title">
    </div>
    <button class="primary" onclick="uploadFile()">업로드</button>
  </div>

  <div id="panel-note" class="panel">
    <div class="field">
      <label>제목</label>
      <input type="text" id="note-title" placeholder="예: 운영 정책 v3">
    </div>
    <div class="field">
      <label>본문 (markdown — 한글 OK)</label>
      <textarea id="note-content" placeholder="## 운영 정책&#10;&#10;- 항목 1&#10;- 항목 2"></textarea>
    </div>
    <button class="primary" onclick="createNote()">노트 생성</button>
  </div>

  <div id="result"></div>

  <script>
    const $ = id => document.getElementById(id);
    function setTab(btn, name) {
      document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      $('panel-' + name).classList.add('active');
    }
    function showResult(ok, text) {
      $('result').className = 'result ' + (ok ? 'ok' : 'err');
      $('result').textContent = (ok ? '✓ ' : '✗ ') + text;
    }

    async function api(path, opts = {}) {
      const r = await fetch(window.LUCAS_API_BASE + path, {
        ...opts,
        headers: { 'X-Tenant-Id': window.LUCAS_TENANT_ID, ...(opts.headers || {}) },
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${JSON.stringify(data)}`);
      return data;
    }

    async function loadRepos() {
      try {
        const r = await api(`/api/v1/tenants/${window.LUCAS_TENANT_ID}/repositories?limit=100`);
        const items = r.data?.items || r.data || [];
        const sel = $('repo-select');
        sel.innerHTML = items.length ? '' : '<option value="">(저장소 없음 — 신규 생성 필요)</option>';
        items.forEach(it => {
          const o = document.createElement('option');
          o.value = it.id;
          o.textContent = `${it.name} (${it.document_count || 0} docs)`;
          sel.appendChild(o);
        });
      } catch (e) {
        showResult(false, 'repo list 실패: ' + e.message);
      }
    }

    async function createRepo() {
      const name = prompt('새 저장소 이름:');
      if (!name) return;
      try {
        const r = await api(`/api/v1/tenants/${window.LUCAS_TENANT_ID}/repositories`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        showResult(true, '생성 완료: ' + r.data.id);
        await loadRepos();
      } catch (e) { showResult(false, e.message); }
    }

    async function uploadFile() {
      const file = $('file-input').files[0];
      const repoId = $('repo-select').value;
      if (!file) return showResult(false, '파일을 선택하세요');
      if (!repoId) return showResult(false, '저장소를 선택하세요');
      const fd = new FormData();
      fd.append('file', file);
      fd.append('repository_id', repoId);
      const title = $('file-title').value.trim();
      if (title) fd.append('title', title);
      try {
        const r = await api('/api/v1/documents/upload', { method: 'POST', body: fd });
        const docId = r.data?.document_id || r.data?.id;
        showResult(true, `업로드 완료. doc_id=${docId}\nstatus=${r.data?.status}\n\n편집: doc-detail-mvp.html?doc_id=${docId}`);
      } catch (e) { showResult(false, e.message); }
    }

    async function createNote() {
      const title = $('note-title').value.trim();
      const content = $('note-content').value.trim();
      const repoId = $('repo-select').value;
      if (!title || !content) return showResult(false, '제목+본문 필수');
      if (!repoId) return showResult(false, '저장소를 선택하세요');
      try {
        const r = await api('/api/v1/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repository_id: repoId, title, content }),
        });
        showResult(true, `노트 생성. id=${r.data?.id}`);
      } catch (e) { showResult(false, e.message); }
    }

    loadRepos();
  </script>
</body>
</html>
