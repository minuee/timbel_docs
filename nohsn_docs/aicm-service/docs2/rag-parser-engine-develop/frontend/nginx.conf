# Locus-KMS frontend — nginx static 서빙 + API same-origin 리버스 프록시.
# /api, /health, /docs 를 lucas-kms-api:8000 으로 프록시 → CORS 불필요, 포트 하드코딩 제거.
server {
    listen 80;
    server_name _;

    # 업로드 한도 (MAX_UPLOAD_SIZE_MB=500 대응 + 여유).
    client_max_body_size 550m;

    # docker embedded DNS — lucas-kms-api 를 런타임 재해석 (컨테이너 재생성 대비).
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # 정적 프론트엔드.
    location / {
        try_files $uri $uri/ =404;
    }

    # API — same-origin 프록시. SSE(assist-stream) 위해 buffering off + 긴 timeout.
    location /api/ {
        set $api http://lucas-kms-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health / Swagger — 같은 origin 으로 노출 (백엔드 정책이 최종 게이트).
    location /health {
        set $api http://lucas-kms-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }
    location /docs {
        set $api http://lucas-kms-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }
    location /redoc {
        set $api http://lucas-kms-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        set $api http://lucas-kms-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }
}
