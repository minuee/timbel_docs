<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 보안 정책(CSP): 앱 안의 파일만 실행. 없으면 Electron 이 "Insecure Content-Security-Policy" 경고를 콘솔에 남긴다(로그 서버 warn).
         style-src unsafe-inline: HTML 의 style="" 속성용. 구글 폰트: 인터넷이 안 되면 안 받아질 뿐 동작엔 영향 없음 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="login.title">로그인</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
    />
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/login.css" />
  </head>

  <body>
    <div class="title-area">
      <div class="title-left">
        <div class="title-text" data-i18n="common.app_title">SKHynix AI 회의록</div>
      </div>
      <div class="title-right">
        <button id="minimizeBtn">
          <img src="../assets/icons/minalizeBtn.svg" alt="" />
        </button>
        <button id="closeBtn">
          <img src="../assets/icons/closeBtn.svg" alt="" />
        </button>
      </div>
    </div>

    <main class="login-wrap">
      <div class="login-heading" data-i18n="login.title">로그인</div>

      <!-- 사번 직접 로그인. authConfig.EMPNO_LOGIN_ENABLED 가 false 면 숨긴다. -->
      <form id="empnoForm" class="login-form" hidden autocomplete="off">
        <input id="empnoInput" class="login-input" type="text" placeholder="사번" data-i18n-placeholder="login.empno" maxlength="20" />
        <input id="passwordInput" class="login-input" type="password" placeholder="비밀번호" data-i18n-placeholder="login.password" maxlength="64" />
        <!-- 사번 저장: 사번 폼이 보일 때만. 로그인 유지: SESSION_PERSIST_ENABLED 가 true 일 때만 보이고 MyAccess 로그인에도 적용된다.
             사번 폼이 숨겨지면 login.js 가 이 줄을 MyAccess 버튼 위로 옮긴다. -->
        <div id="loginOptions" class="login-options" hidden>
          <label class="login-check" id="rememberEmpnoLabel" hidden>
            <input id="rememberEmpnoCheck" type="checkbox" />
            <span data-i18n="login.remember_empno">사번 저장</span>
          </label>
          <label class="login-check" id="keepLoginLabel" hidden>
            <input id="keepLoginCheck" type="checkbox" />
            <span data-i18n="login.keep_login">로그인 유지</span>
          </label>
        </div>
        <button id="empnoSubmitBtn" class="login-btn primary" type="submit" data-i18n="login.submit">로그인</button>
        <div class="login-divider" id="loginDivider"><span data-i18n="login.or">또는</span></div>
      </form>

      <button id="ssoBtn" class="login-btn sso" type="button" data-i18n="login.sso">MyAccess 로그인</button>

      <!-- 테스트용: SSO 협조 전에 녹음→업로드를 시험하기 위해 웹에서 받은 토큰으로 바로 로그인.
           authConfig.MANUAL_LOGIN_ENABLED 가 false 면 숨긴다. -->
      <details id="manualLogin" class="manual-login" hidden>
        <summary data-i18n="login.manual_summary">테스트 로그인 (토큰 직접 입력)</summary>
        <form id="manualForm" class="login-form" autocomplete="off">
          <input id="manualName" class="login-input" type="text" placeholder="이름" data-i18n-placeholder="login.manual_name" maxlength="40" />
          <input id="manualEmpno" class="login-input" type="text" placeholder="사번" data-i18n-placeholder="login.empno" maxlength="20" />
          <input id="manualToken" class="login-input" type="password" placeholder="accessToken" />
          <input id="manualEndpoint" class="login-input" type="text" placeholder="서버 주소 (비우면 기본값)" />
          <button id="manualSubmitBtn" class="login-btn secondary" type="submit" data-i18n="login.manual_submit">토큰으로 로그인</button>
        </form>
      </details>

      <div id="loginMessage" class="login-message" role="status" aria-live="polite"></div>
      <!-- 화면 언어. MULTI_LANG_ENABLED 가 true 일 때만 보인다(scripts/languageSelect.js) -->
      <div class="language-select-wrap" id="languageSelectWrap" data-screen="login" hidden>
        <svg class="language-select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <select id="languageSelect" class="language-select" aria-label="언어" data-i18n-aria-label="common.language"></select>
      </div>
    </main>

    <!-- 약관 미동의 안내. 사번 로그인 응답 또는 로그인 뒤 확인(HMP 404/422)에서 미동의면 띄운다.
         본문의 링크는 login.js 가 그린다(문구 안 {url} 자리). 이미 로그아웃된 상태라 [로그아웃]은 팝업만 닫는다. -->
    <div id="termsModal" class="terms-modal" role="dialog" aria-modal="true" aria-labelledby="termsTitle" hidden>
      <div class="terms-box">
        <div id="termsTitle" class="terms-title" data-i18n="terms.title">약관 안내 메시지</div>
        <p id="termsBody" class="terms-body"></p>
        <div class="terms-actions">
          <button id="termsLogoutBtn" class="login-btn secondary" type="button" data-i18n="terms.logout">로그아웃</button>
          <button id="termsQuitBtn" class="login-btn primary" type="button" data-i18n="terms.quit">앱 종료</button>
        </div>
      </div>
    </div>

    <script src="../scripts/languageSelect.js"></script>
    <script src="../scripts/login.js"></script>
  </body>
</html>
