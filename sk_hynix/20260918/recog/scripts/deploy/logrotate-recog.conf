# Install target: /etc/logrotate.d/recog
# Rotates the recog-backend cleanup metric log produced by recog-cleanup.service.

/home/jwpark/timblo-hynix/recog-backend/runtime/cleanup.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0644 jwpark jwpark
}
