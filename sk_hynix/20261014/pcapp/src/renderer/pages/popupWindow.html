<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팝업 윈도우</title>
  <link rel="stylesheet" href="../styles/index.css">
  <link rel="stylesheet" href="../styles/popupWindow.css">
</head>
<body>
  <div class="title-area"></div>
  <div class="popup-container">
    <!-- 공통 영역 -->
    <div class="popup-text-area">
      <div class="popup-title">팝업이 열렸습니다.</div>
      <div class="popup-subtitle">팝업 내용이 여기에 표시됩니다.</div>
      <div class="popup-warning hidden">경고 내용이 여기에 표시됩니다.</div>
    </div>
    <!-- 프로그레스 바 영역 -->
    <div class="progress-area hidden">
      <div class="progress-bar-area">
        <div class="progress-bar-wrap">
          <div class="progress-bar" style="width:0%"></div>
        </div>
        <div class="progress-bar-percent">0%</div>
      </div>
      <div class="progress-text">전송 속도: 5.3MB/초</div>
    </div>
    <!-- 버튼 영역 -->
    <div class="popup-content">
      <button class="btn btn-cancel" id="cancelBtn">취소</button>
      <button class="btn btn-confirm" id="confirmBtn">확인</button>
    </div>
  </div>

  <script src="../scripts/popupWindow.js"></script>
</body>

</html>
