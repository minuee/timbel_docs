<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>업데이트</title>
    <link rel="stylesheet" href="../styles/index.css" />
    <style>
      .update-wrap {
        width: 100%;
        flex: 1;
        padding: 32px 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }
      .update-heading {
        font-size: 18px;
        font-weight: 600;
      }
      .update-desc {
        font-size: 13px;
        line-height: 1.5;
        color: var(--dark-gray-400);
        white-space: pre-line;
      }
      .update-desc.error {
        color: #f9463b;
      }
      .update-bar {
        height: 8px;
        border-radius: 4px;
        background: var(--dark-gray-500);
        overflow: hidden;
      }
      .update-bar-fill {
        height: 100%;
        width: 0%;
        background: #f9463b;
        transition: width 0.3s ease;
      }
      .update-percent {
        font-size: 12px;
        color: var(--dark-gray-400);
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="title-area">
      <div class="title-left">
        <div class="title-text">AI 회의록 녹음기</div>
      </div>
    </div>

    <!-- 강제 업데이트라 닫기/최소화 버튼을 두지 않는다. 창을 강제로 닫으면 다음 실행 때 다시 시도한다. -->
    <main class="update-wrap">
      <div class="update-heading" id="updateHeading">업데이트를 준비하고 있습니다</div>
      <div class="update-desc" id="updateDesc">새 버전을 내려받는 중입니다.
잠시만 기다려 주세요.</div>
      <div class="update-bar"><div class="update-bar-fill" id="updateBarFill"></div></div>
      <div class="update-percent" id="updatePercent">0%</div>
    </main>

    <script>
      const heading = document.getElementById("updateHeading");
      const desc = document.getElementById("updateDesc");
      const fill = document.getElementById("updateBarFill");
      const percentText = document.getElementById("updatePercent");

      window.updateAPI.onStatus((status) => {
        if (!status) return;
        const version = status.version ? `v${status.version}` : "새 버전";
        if (status.stage === "downloading") {
          heading.textContent = `${version} 으로 업데이트 중입니다`;
          desc.textContent = "새 버전을 내려받는 중입니다.\n잠시만 기다려 주세요.";
          desc.classList.remove("error");
        } else if (status.stage === "installing") {
          heading.textContent = `${version} 설치 중입니다`;
          desc.textContent = "앱이 잠시 종료된 뒤 자동으로 다시 실행됩니다.\n관리자 권한 확인 창이 뜨면 '예'를 눌러 주세요.";
        } else if (status.stage === "failed") {
          heading.textContent = "업데이트에 실패했습니다";
          desc.textContent = "지금은 현재 버전으로 계속 사용합니다.\n다음에 앱을 실행할 때 다시 시도합니다.";
          desc.classList.add("error");
        }
        const percent = Math.max(0, Math.min(100, Number(status.percent) || 0));
        fill.style.width = `${percent}%`;
        percentText.textContent = `${percent}%`;
      });
    </script>
  </body>
</html>
