# pcapp-log-server — 망분리 서버 기동 정의
#
# 이미지는 docker load 로 이미 적재되어 있다고 가정한다.
# 레지스트리는 쳐다보지 않는다 (pull_policy: never).
#
# 기동:
#   docker compose --env-file .env up -d
#
# 같은 디렉터리에 있어야 하는 것:
#   docker-compose.yml   이 파일
#   .env                 .env.example 을 복사해서 값만 채운 것

services:
  pcapp-log-server:
    # docker load 로 적재한 이미지 이름과 정확히 같아야 한다.
    # install.sh 가 .env 의 두 값을 적재된 이미지로 자동으로 맞춰준다.
    image: ${IMAGE_NAME:-pcapp-log-server}:${IMAGE_VERSION:-latest}

    # 망분리에서 pull 을 시도하면 타임아웃까지 멈춰 있다가 실패한다.
    # never 로 두면 이미지가 없을 때 즉시 "이미지 없음"으로 죽어서 원인이 바로 보인다.
    pull_policy: never

    container_name: pcapp-log-server
    restart: unless-stopped

    # 서버 계정(aimm)의 uid:gid 로 돌린다. 그래야 호스트에서 로그 파일을 읽고 지울 수 있다.
    # install.sh 가 .env 에 실제 값을 써준다.
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"

    env_file:
      - .env

    ports:
      - "${HOST_PORT:-9996}:${PORT:-9996}"

    volumes:
      # 날짜별 로그 파일(pcapp-YYYY-MM-DD.log)이 여기 쌓인다. LOG_RETENTION_DAYS 가 지나면 서버가 지운다.
      # 호스트 경로라서 컨테이너를 지우거나 이미지를 갈아끼워도 남는다.
      - ${LOG_HOST_DIR:-./logs}:/var/lib/pcapp-log

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+(process.env.PORT||9996)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Dozzle 이 보는 도커 로그. 실시간 조회용이라 짧게 둔다(장기 보관은 위 볼륨의 파일).
    # 컨테이너를 새 이미지로 교체하면 도커 로그는 사라진다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
