<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 보안 정책(CSP): 앱 안의 파일만 실행. 없으면 Electron 이 "Insecure Content-Security-Policy" 경고를 콘솔에 남긴다(로그 서버 warn).
         style-src unsafe-inline: HTML 의 style="" 속성용. 구글 폰트: 인터넷이 안 되면 안 받아질 뿐 동작엔 영향 없음 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 회의록 녹음기</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/recordingWindow.css" />
  </head>
  <body>
    <div class="title-area">
      <div class="title-left">
        <div class="title-text" id="titleText">AI 회의록 녹음기</div>
        <button class="setting-btn" id="settingBtn">
          <img src="../assets/icons/settingBtn.svg" alt="" />
        </button>
      </div>

      <!-- 버튼 근처에 떠 있는 메뉴 -->
      <div id="settings-menu" class="settings-menu" hidden>
        <!-- menu-state: 현재 상태(켜짐/꺼짐/일부) — 메뉴를 열 때 recording.js 가 채운다 -->
        <button class="menu-item" id="alwaysOnTab">항상 위<span class="menu-state" id="aotStateText"></span></button>
        <button class="menu-item" id="muteTab">음소거<span class="menu-state" id="muteStateText"></span></button>
        <!-- 녹음 중이 아닐 때만 동작: 마이크 테스트 화면으로(재로그인 없음) / 로그인 화면으로 -->
        <button class="menu-item" id="changeDeviceBtn">장치 변경</button>
        <button class="menu-item" id="logoutBtn">로그아웃</button>
        <!-- 앱 버전 + 헬퍼 버전(AEC: WebRTC 에코 제거 포함 빌드). 메뉴 폭이 좁아 두 줄로 -->
        <div class="menu-item" id="versionInfoTab">버전 정보
          <span class="version-lines">
            <span id="appVersionText">앱 -</span>
            <span id="versionInfoText">헬퍼 -</span>
          </span>
        </div>
        <button class="menu-item" id="closeAppBtn">앱 종료</button>
      </div>
      <!-- 항상 위 세부옵션 -->
      <div id="settings-aot-items" class="settings-detail" hidden>
        <button class="aot-item" id="aot-item-1">항상 위 켜기</button>
        <button class="aot-item" id="aot-item-2">항상 위 끄기</button>
      </div>
      <!-- 음소거 세부옵션 -->
      <div id="settings-mute-items" class="settings-detail" hidden>
        <button class="mute-item" id="mute-item-1">음소거 설정</button>
        <button class="mute-item" id="mute-item-2">음소거 해제</button>
      </div>

      <div class="title-right">
        <button id="topBtn" aria-label="항상 위">
          <img src="../assets/icons/aotNoActiveBtn.svg" alt="" />
        </button>
        <button id="minimizeBtn" aria-label="최소화">
          <img src="../assets/icons/minalizeBtn.svg" alt="" />
        </button>
      </div>
    </div>

    <div class="main-section">
      <div class="recording-info">
        <div class="left-info">
          <div class="sound-group">
            <div class="mic-group">
              <div class="sound-group-icon mic-icon" id="micIcon">
                <span class="material-icons">mic</span>
              </div>
              <div class="level-meter" id="micMeter">
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
              </div>
            </div>
            <div class="sys-group">
              <div class="sound-group-icon sys-icon" id="sysIcon">
                <span class="material-icons">volume_up</span>
              </div>
              <div class="level-meter" id="sysMeter">
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
                <div class="level-box"></div>
              </div>
            </div>
          </div>
          <div class="remain-time">
            <div class="remain-time-meter">
              <div class="remain-time-bar" id="remainTimeBar"></div>
            </div>
            <div class="remain-time-text">
              <p>남은 시간</p>
              <p>03:00:00</p>
            </div>
          </div>
        </div>
        <div class="right-info">
          <div class="progress-time">
            <div class="recording-status-circle hidden"></div>
            <div class="recording-time">00 : 00 : 00</div>
          </div>
          <button class="upload-list-btn" id="upload-list-btn">
            <img src="../assets/icons/uploadListBtn.svg" alt="" />
          </button>
        </div>
      </div>

      <!-- 녹음 중 웨이브: 헬퍼 level 이벤트로 그린다(recording.js 웨이브). 일시정지하면 멈추고 회색 -->
      <div class="wave-section">
        <canvas id="waveCanvas" aria-hidden="true"></canvas>
        <div class="segment-info hidden"></div>
      </div>

      <div class="audio-area">
        <div class="noti-area">
          <div class="noti">
            <span><img src="../assets/icons/noti.svg" alt="" />녹음 중인 대화입니다. 반드시 상대방의 동의를 받으세요.</span>
            
          </div>
        </div>
        <div class="audio-components">
          <div class="record-control" id="recordCancelBtn">녹음 취소</div>
          <button id="pause-btn">
            <img src="../assets/icons/pause_small.svg" alt="" />
          </button>
          <div class="record-control" id="recordCompleteBtn">녹음 종료</div>
        </div>
      </div>
    </div>

    <script src="../scripts/recording.js"></script>
  </body>
</html>
