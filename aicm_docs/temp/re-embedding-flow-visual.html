<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Re-embedding 판단 로직 — 애니메이션 시각화</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;background:#080c18;color:#e2e8f0;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:2rem 1.5rem 4rem}
h1{text-align:center;font-size:2rem;font-weight:800;color:#f1f5f9;margin-bottom:.3rem}
.subtitle{text-align:center;color:#64748b;font-size:1rem;margin-bottom:2.5rem}

/* Tabs */
.tabs{display:flex;gap:3px;overflow-x:auto;margin-bottom:0}
.tab{padding:10px 18px;background:#111827;border:1px solid #1f2937;border-bottom:none;border-radius:10px 10px 0 0;cursor:pointer;color:#64748b;font-weight:700;font-size:.82rem;white-space:nowrap;transition:all .15s;user-select:none}
.tab:hover{background:#1a2234;color:#94a3b8}
.tab.active{background:#1e293b;color:#f1f5f9;border-color:#334155}

/* Panel */
.panel{display:none;background:#111827;border:1px solid #1f2937;border-radius:0 12px 12px 12px;padding:2rem;min-height:600px}
.panel.active{display:block}

/* Case Banner */
.case-banner{margin-bottom:1.2rem}
.case-badges{display:flex;gap:6px;margin-bottom:6px}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.5px}
.badge-modify{background:#92400e;color:#fcd34d}
.badge-add{background:#065f46;color:#6ee7b7}
.badge-delete{background:#7f1d1d;color:#fca5a5}
.badge-move{background:#1e3a5f;color:#93c5fd}
.badge-group{background:#581c87;color:#d8b4fe}
.badge-split{background:#312e81;color:#a5b4fc}
.badge-nm{background:linear-gradient(135deg,#581c87,#1e3a5f);color:#c4b5fd;border:1px solid rgba(196,181,253,.3)}
.case-title{font-size:1.25rem;font-weight:800;color:#f1f5f9;margin-bottom:4px}
.case-desc{font-size:.88rem;color:#94a3b8}

/* Controls */
.controls{display:flex;align-items:center;gap:10px;margin:1.2rem 0;padding:12px 16px;background:#0a0e1a;border:1px solid #1a2233;border-radius:10px}
.btn{padding:8px 20px;border:none;border-radius:8px;font-weight:700;font-size:.82rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-play{background:#3b82f6;color:#fff}
.btn-play:hover{background:#2563eb}
.btn-play:disabled{background:#1e3a5f;color:#64748b;cursor:not-allowed}
.btn-step{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.btn-step:hover{background:#334155;color:#f1f5f9}
.btn-step:disabled{opacity:.4;cursor:not-allowed}
.btn-reset{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.btn-reset:hover{background:#334155;color:#f1f5f9}
.progress-bar{flex:1;height:6px;background:#1e293b;border-radius:3px;overflow:hidden;margin:0 8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .4s ease;width:0}
.step-label{font-size:.75rem;color:#64748b;min-width:80px;text-align:right}

/* Block Diagram */
.diagram{position:relative;padding:30px 20px 20px;background:#0a0e1a;border:1px solid #1a2233;border-radius:12px;margin:1rem 0;overflow-x:auto}
.diagram-label{position:absolute;top:8px;left:16px;font-size:.65rem;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:1.5px}
.block-row{display:flex;gap:0;align-items:flex-start;min-height:80px;position:relative;flex-wrap:wrap}

/* Chunk Group in Diagram */
.chunk-group{display:flex;gap:3px;padding:8px 8px 0;border-radius:8px;position:relative;margin:0 4px;transition:all .5s ease;border:2px solid transparent;flex-direction:column;align-items:center}
.chunk-group .chunk-blocks{display:flex;gap:3px}
.chunk-group .chunk-label{font-size:.6rem;font-weight:800;text-align:center;margin-top:4px;padding:2px 4px;line-height:1.2;transition:all .4s ease;word-break:keep-all}

/* Block in Diagram */
.block{width:52px;min-height:44px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;transition:all .5s ease;position:relative;overflow:hidden}
.block .block-id{font-size:.65rem;font-weight:900}
.block .block-hint{font-size:.5rem;opacity:.7;max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block-short{min-height:28px}
.block-tall{min-height:60px}

/* Block Colors */
.blk-normal{background:#1e293b;color:#64748b}
.blk-modified{background:#f59e0b;color:#1e293b}
.blk-added{background:#10b981;color:#1e293b}
.blk-deleted{background:#ef4444;color:#fff}
.blk-heading{background:#0ea5e9;color:#fff}
.blk-moved{background:#3b82f6;color:#fff}
.blk-target{border:2px solid #f59e0b;background:rgba(245,158,11,.15);color:#f59e0b}

/* Chunk Group Colors */
.cg-keep{background:rgba(59,130,246,.06);border-color:rgba(59,130,246,.2)}
.cg-keep .chunk-label{color:#3b82f6}
.cg-affected{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3)}
.cg-affected .chunk-label{color:#f59e0b}
.cg-rebuild{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.3)}
.cg-rebuild .chunk-label{color:#8b5cf6}
.cg-new{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3)}
.cg-new .chunk-label{color:#10b981}
.cg-delete{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3)}
.cg-delete .chunk-label{color:#ef4444}
.cg-dimmed{opacity:.3}

/* Animations */
@keyframes scanner{
  0%{left:-60px;opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{left:calc(100% + 60px);opacity:0}
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}
  50%{box-shadow:0 0 20px 6px rgba(245,158,11,.3)}
}
@keyframes pulse-red{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}
  50%{box-shadow:0 0 20px 6px rgba(239,68,68,.3)}
}
@keyframes pulse-green{
  0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}
  50%{box-shadow:0 0 20px 6px rgba(16,185,129,.3)}
}
@keyframes pulse-purple{
  0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.5)}
  50%{box-shadow:0 0 20px 6px rgba(139,92,246,.3)}
}
@keyframes pulse-blue{
  0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}
  50%{box-shadow:0 0 20px 6px rgba(59,130,246,.3)}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-3px)}
  40%{transform:translateX(3px)}
  60%{transform:translateX(-2px)}
  80%{transform:translateX(2px)}
}
@keyframes dissolve{
  0%{opacity:1;transform:scale(1);filter:blur(0)}
  50%{opacity:.5;transform:scale(.95);filter:blur(1px)}
  100%{opacity:0;transform:scale(.85);filter:blur(4px)}
}
@keyframes materialize{
  0%{opacity:0;transform:scale(.8) translateY(10px);filter:blur(4px)}
  50%{opacity:.6;transform:scale(.95) translateY(3px);filter:blur(1px)}
  100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}
}
@keyframes slideIn{
  0%{opacity:0;transform:translateY(-20px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes moveBlock{
  0%{transform:translateY(0)}
  30%{transform:translateY(-40px)}
  70%{transform:translateY(-40px) translateX(var(--move-x,100px))}
  100%{transform:translateY(0) translateX(var(--move-x,100px))}
}
@keyframes glow-border{
  0%,100%{border-color:rgba(245,158,11,.3)}
  50%{border-color:rgba(245,158,11,.8)}
}
@keyframes scanline{
  0%{left:-4px}
  100%{left:calc(100% + 4px)}
}
@keyframes fadeInUp{
  0%{opacity:0;transform:translateY(12px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes checkmark{
  0%{transform:scale(0) rotate(-45deg);opacity:0}
  50%{transform:scale(1.3) rotate(0);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}

.scanning .block-row::after{
  content:'';position:absolute;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,transparent,#3b82f6,transparent);
  border-radius:2px;box-shadow:0 0 20px 4px rgba(59,130,246,.4);
  animation:scanline 1.2s ease-in-out;z-index:10;
}
.anim-pulse{animation:pulse .8s ease-in-out 2}
.anim-pulse-red{animation:pulse-red .8s ease-in-out 2}
.anim-pulse-green{animation:pulse-green .8s ease-in-out 2}
.anim-pulse-purple{animation:pulse-purple .8s ease-in-out 2}
.anim-pulse-blue{animation:pulse-blue .8s ease-in-out 2}
.anim-shake{animation:shake .4s ease-in-out}
.anim-dissolve{animation:dissolve .8s ease-out forwards}
.anim-materialize{animation:materialize .7s ease-out forwards}
.anim-slideIn{animation:slideIn .5s ease-out}
.anim-glow{animation:glow-border 1s ease-in-out 2}

/* Step Log */
.step-log{margin:1rem 0;min-height:200px}
.step-entry{display:flex;gap:10px;margin:6px 0;font-size:.84rem;align-items:flex-start;opacity:0;transform:translateY(8px);transition:all .4s ease}
.step-entry.visible{opacity:1;transform:translateY(0)}
.step-num{min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.7rem;font-weight:800;flex-shrink:0}
.sn-scan{background:#1e3a5f;color:#60a5fa}
.sn-detect{background:#78350f;color:#fcd34d}
.sn-action{background:#3b0764;color:#d8b4fe}
.sn-result{background:#064e3b;color:#6ee7b7}
.sn-delete{background:#450a0a;color:#fca5a5}
.step-text{color:#94a3b8;padding-top:2px}
.step-text em{font-style:normal;font-weight:700}
.step-text .t-mod{color:#fbbf24}
.step-text .t-add{color:#34d399}
.step-text .t-del{color:#f87171}
.step-text .t-reb{color:#a78bfa}
.step-text .t-keep{color:#60a5fa}
.step-text .t-imp{color:#f59e0b;font-weight:700}

/* Change Event */
.change-event{padding:14px 18px;margin:12px 0;background:rgba(245,158,11,.06);border:1px dashed rgba(245,158,11,.25);border-radius:10px;font-size:.85rem;opacity:0;transform:translateY(-10px);transition:all .5s ease}
.change-event.visible{opacity:1;transform:translateY(0)}
.change-icon{font-size:1.3rem;margin-right:10px}
.change-title{color:#fbbf24;font-weight:700}
.change-payload{font-size:.78rem;color:#94a3b8;margin-top:3px;font-family:'Fira Code','Cascadia Code',monospace}
.cp-mod{color:#fbbf24}.cp-add{color:#34d399}.cp-del{color:#f87171}.cp-blk{color:#60a5fa}.cp-sep{color:#334155;margin:0 2px}

/* Transition Map (animated) */
.tmap{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding:14px 18px;background:#0a0e1a;border-radius:10px;margin:14px 0;border:1px solid #1a2233;opacity:0;transform:translateY(8px);transition:all .5s ease}
.tmap.visible{opacity:1;transform:translateY(0)}
.tmap-title{font-size:.72rem;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:1.5px;width:100%;margin-bottom:4px}
.tflow{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;opacity:0;transform:scale(.9);transition:all .4s ease}
.tflow.visible{opacity:1;transform:scale(1)}
.tbadge{padding:3px 10px;border-radius:14px;font-size:.72rem;font-weight:700}
.tb-from{background:#1e293b;color:#94a3b8}
.tb-keep{background:#1e3a5f;color:#93c5fd}
.tb-rebuild{background:#3b0764;color:#d8b4fe}
.tb-new{background:#064e3b;color:#6ee7b7}
.tb-delete{background:#450a0a;color:#fca5a5}
.tarrow{color:#475569}

/* Summary */
.summary{background:linear-gradient(135deg,#0f172a,#162032);border:1px solid #1e3a5f;border-radius:12px;padding:18px 22px;margin-top:16px;opacity:0;transform:translateY(10px);transition:all .6s ease}
.summary.visible{opacity:1;transform:translateY(0)}
.summary-title{font-size:.85rem;font-weight:800;color:#f1f5f9;margin-bottom:8px}
.summary-text{font-size:.85rem;color:#94a3b8;margin-bottom:4px}
.summary-cost{font-size:.9rem;font-weight:700;margin-top:8px}
.cost-low{color:#10b981}.cost-mid{color:#f59e0b}.cost-high{color:#ef4444}.cost-zero{color:#10b981}
.summary-key{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;font-size:.82rem;color:#f59e0b;font-weight:600}

/* Arrow between diagrams */
.arrow-separator{text-align:center;font-size:2rem;color:#475569;margin:8px 0;opacity:0;transition:all .4s ease}
.arrow-separator.visible{opacity:1}

/* Split wrap */
.split-wrap{display:flex;gap:0;border:2px dashed rgba(139,92,246,.35);border-radius:10px;padding:4px;margin:0 4px}
.split-wrap .chunk-group{margin:0 2px}

/* Speed selector */
.speed-sel{display:flex;align-items:center;gap:4px;margin-left:auto;font-size:.72rem;color:#64748b}
.speed-sel select{background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:4px;padding:2px 6px;font-size:.72rem;cursor:pointer}

/* Delete chunk strikethrough */
.cg-delete .block{opacity:.5;text-decoration:line-through}
.cg-delete .chunk-label{text-decoration:line-through}

/* Dim keep chunks when others are highlighted */
.chunk-group.cg-dimmed{opacity:.25;transition:opacity .5s ease}

/* Speed control highlight */
.speed-sel select:focus{outline:1px solid #3b82f6}

/* Smooth scroll for step log */
.step-log{scroll-behavior:smooth}

/* Tooltip-like label for blocks on hover */
.block{cursor:default}
.block:hover{transform:scale(1.08);z-index:5}

/* Legend inline for quick reference */
.legend-inline{display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;margin:8px 0;background:#0a0e1a;border-radius:8px;border:1px solid #1a2233;font-size:.7rem}
.legend-inline .li-item{display:flex;align-items:center;gap:4px}
.legend-inline .li-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}

@media(max-width:700px){
  .wrap{padding:1rem}
  .tabs{gap:2px}
  .tab{padding:8px 12px;font-size:.72rem}
  .panel{padding:1rem}
  .block{width:40px;min-height:36px}
  .controls{flex-wrap:wrap;gap:6px}
  .btn{padding:6px 14px;font-size:.75rem}
  .speed-sel{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Re-embedding 판단 로직 시각화</h1>
<p class="subtitle">retrieval-service가 변경을 감지하고 임베딩 범위를 결정하는 과정 — 애니메이션</p>

<div class="legend-inline">
  <div class="li-item"><div class="li-swatch" style="background:#1e293b"></div>일반 블록</div>
  <div class="li-item"><div class="li-swatch" style="background:#f59e0b"></div>수정됨</div>
  <div class="li-item"><div class="li-swatch" style="background:#10b981"></div>추가</div>
  <div class="li-item"><div class="li-swatch" style="background:#ef4444"></div>삭제</div>
  <div class="li-item"><div class="li-swatch" style="background:#3b82f6"></div>이동</div>
  <div class="li-item"><div class="li-swatch" style="background:#0ea5e9"></div>헤딩</div>
  <div class="li-item"><div class="li-swatch" style="border:2px solid #f59e0b;background:transparent"></div>변경 대상</div>
  <div class="li-item">|</div>
  <div class="li-item" style="color:#3b82f6">■ 유지</div>
  <div class="li-item" style="color:#f59e0b">■ 영향</div>
  <div class="li-item" style="color:#8b5cf6">■ 재생성</div>
  <div class="li-item" style="color:#10b981">■ 신규</div>
  <div class="li-item" style="color:#ef4444">■ 삭제</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="c1">Case 1: 수정</div>
  <div class="tab" data-tab="c2">Case 2: 추가</div>
  <div class="tab" data-tab="c3">Case 3: 삭제</div>
  <div class="tab" data-tab="c4">Case 4: 이동</div>
  <div class="tab" data-tab="c5">Case 5: 그룹 영향</div>
  <div class="tab" data-tab="c6">Case 6: 복합</div>
  <div class="tab" data-tab="c7">Case 7: 블록 분할</div>
  <div class="tab" data-tab="c8">Case 8: N:M 매핑</div>
</div>

<div id="c1" class="panel active"></div>
<div id="c2" class="panel"></div>
<div id="c3" class="panel"></div>
<div id="c4" class="panel"></div>
<div id="c5" class="panel"></div>
<div id="c6" class="panel"></div>
<div id="c7" class="panel"></div>
<div id="c8" class="panel"></div>
</div>

<script>
const CASES = {
  c1: {
    badges: [{t:'MODIFY',c:'badge-modify'}],
    title: '블록 1개 텍스트 수정 (토씨 수정)',
    desc: 'B5 블록의 텍스트가 소폭 변경 → B5가 속한 청크(C3)만 재생성하는 최소 비용 시나리오',
    beforeBlocks: [
      {id:'B1',hint:'계좌개설 안내',type:'normal'},
      {id:'B2',hint:'영업점/모바일',type:'normal'},
      {id:'B3',hint:'필요서류',type:'normal'},
      {id:'B4',hint:'미성년자 동의',type:'normal'},
      {id:'B5',hint:'비대면 인증',type:'target'},
      {id:'B6',hint:'상품종류',type:'normal'},
      {id:'B7',hint:'계좌한도',type:'normal'},
      {id:'B8',hint:'외국인 서류',type:'normal'},
      {id:'B9',hint:'법인 서류',type:'normal'},
      {id:'B10',hint:'고객센터',type:'normal'}
    ],
    beforeChunks: [
      {id:'C1',blockIds:['B1','B2'],status:'keep'},
      {id:'C2',blockIds:['B3'],status:'keep'},
      {id:'C3',blockIds:['B4','B5'],status:'affected'},
      {id:'C4',blockIds:['B6','B7'],status:'keep'},
      {id:'C5',blockIds:['B8','B9','B10'],status:'keep'}
    ],
    changeEvent: {
      title: 'B5의 content_hash 변경 감지',
      payload: '<span class="cp-mod">modified: ["B5"]</span><span class="cp-sep"> · </span><span class="cp-add">added: []</span><span class="cp-sep"> · </span><span class="cp-del">removed: []</span>'
    },
    afterChunks: [
      {id:'C1',blockIds:['B1','B2'],status:'keep'},
      {id:'C2',blockIds:['B3'],status:'keep'},
      {id:"C3'",blockIds:['B4','B5'],status:'rebuild',blockOverrides:{B5:{type:'modified',hint:'수정됨!'}}},
      {id:'C4',blockIds:['B6','B7'],status:'keep'},
      {id:'C5',blockIds:['B8','B9','B10'],status:'keep'}
    ],
    steps: [
      {icon:'sn-scan',text:'전체 블록 목록을 <em class="t-keep">스캔</em>합니다... 10개 블록 수신',anim:'scan'},
      {icon:'sn-detect',text:'B5 → <em class="t-mod">modified_block_ids</em>에 존재! 내용이 수정되었습니다',anim:'detect',targets:{blocks:['B5']}},
      {icon:'sn-scan',text:'B5가 속한 기존 청크를 찾습니다 → <em class="t-imp">C3 (B4+B5)</em>',anim:'highlight-chunk',targets:{chunks:['C3']}},
      {icon:'sn-action',text:'C3의 구성 블록(B4, B5)으로 <em class="t-reb">재청킹 → C3\' 생성</em>',anim:'rebuild',targets:{oldChunks:['C3'],newChunks:["C3'"]}},
      {icon:'sn-result',text:'나머지 C1, C2, C4, C5: 구성 블록 변경 없음 → <em class="t-keep">유지 ✓</em>',anim:'keep-rest'}
    ],
    transitionMap: [
      {from:'C1',to:'C1 ✓',type:'keep'},
      {from:'C2',to:'C2 ✓',type:'keep'},
      {from:'C3',mid:'🗑️',to:"C3' 🔄",type:'rebuild'},
      {from:'C4',to:'C4 ✓',type:'keep'},
      {from:'C5',to:'C5 ✓',type:'keep'}
    ],
    summary: {
      text: 'B5가 속한 청크(C3)만 재생성. B4는 B5와 같은 그룹이므로 함께 재청킹됨.',
      cost: '💰 임베딩 비용: 청크 1개분 (전체 5개 중 1개)',
      costClass: 'cost-low',
      key: ''
    }
  },

  c2: {

class AnimEngine {
  constructor(caseId, data) {
    this.caseId = caseId;
    this.data = data;
    this.currentStep = -1;
    this.totalSteps = data.steps.length + 2;
    this.playing = false;
    this.stepping = false;
    this.speed = 1;
    this.panel = document.getElementById(caseId);
    this.render();
  }

  render() {
    const d = this.data;
    let html = '';

    html += `<div class="case-banner">
      <div class="case-badges">${d.badges.map(b => `<span class="badge ${b.c}">${b.t}</span>`).join('')}</div>
      <div class="case-title">${d.title}</div>
      <div class="case-desc">${d.desc}</div>
    </div>`;

    html += `<div class="controls">
      <button class="btn btn-play" data-action="play">▶ 자동 재생</button>
      <button class="btn btn-step" data-action="step">⏭ 다음 단계</button>
      <button class="btn btn-reset" data-action="reset" disabled>↺ 처음부터</button>
      <div class="progress-bar"><div class="progress-fill" data-progress></div></div>
      <div class="step-label" data-step-label>▶ 클릭하여 시작</div>
      <div class="speed-sel"><span>속도:</span><select data-speed>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select></div>
    </div>`;

    html += `<div class="diagram" data-diagram="before">
      <div class="diagram-label">📄 BEFORE — 기존 임베딩 상태</div>
      <div class="block-row" data-blockrow="before">${this.renderChunkGroups(d.beforeChunks, d.beforeBlocks, {})}</div>
    </div>`;

    html += `<div class="change-event" data-change-event>
      <span class="change-icon">⚡</span>
      <div><div class="change-title">${d.changeEvent.title}</div>
      <div class="change-payload">${d.changeEvent.payload}</div></div>
    </div>`;

    html += `<div class="step-log" data-step-log>`;
    d.steps.forEach((s, i) => {
      html += `<div class="step-entry" data-step="${i}">
        <span class="step-num ${s.icon}">${i + 1}</span>
        <span class="step-text">${s.text}</span>
      </div>`;
    });
    html += `</div>`;

    html += `<div class="arrow-separator" data-arrow>▼ 처리 결과 ▼</div>`;

    html += `<div class="diagram" data-diagram="after" style="opacity:0;transform:translateY(10px);transition:all .6s ease">
      <div class="diagram-label">✅ AFTER — retrieval-service 처리 결과</div>
      <div class="block-row" data-blockrow="after">${this.renderChunkGroups(d.afterChunks, d.beforeBlocks, this.collectOverrides(d.afterChunks))}</div>
    </div>`;

    html += `<div class="tmap" data-tmap>
      <div class="tmap-title">청크 전환 맵</div>
      ${d.transitionMap.map((t, i) => {
        let inner = '';
        if (t.from) inner += `<span class="tbadge tb-from">${t.from}</span><span class="tarrow">→</span>`;
        if (t.mid) inner += `<span class="tbadge tb-delete">${t.mid}</span><span class="tarrow">→</span>`;
        inner += `<span class="tbadge tb-${t.type}">${t.to}</span>`;
        return `<div class="tflow" data-tflow="${i}">${inner}</div>`;
      }).join('')}
    </div>`;

    html += `<div class="summary" data-summary>
      <div class="summary-title">📊 결과</div>
      <div class="summary-text">${d.summary.text}</div>
      <div class="summary-cost ${d.summary.costClass}">${d.summary.cost}</div>
      ${d.summary.key ? `<div class="summary-key">${d.summary.key}</div>` : ''}
    </div>`;

    this.panel.innerHTML = html;
    this.bindEvents();
  }

  collectOverrides(chunks) {
    const map = {};
    chunks.forEach(c => {
      if (c.blockOverrides) Object.assign(map, c.blockOverrides);
    });
    return map;
  }

  renderChunkGroups(chunks, allBlocks, overrides) {
    const blockMap = {};
    allBlocks.forEach(b => blockMap[b.id] = b);

    return chunks.map(chunk => {
      const statusCls = {keep:'cg-keep',affected:'cg-affected',rebuild:'cg-rebuild',new:'cg-new',delete:'cg-delete'}[chunk.status] || 'cg-keep';
      const label = chunk.label || chunk.id;

      const blocksHtml = chunk.blockIds.map(bid => {
        const base = blockMap[bid] || {id: bid, hint: bid, type: 'normal'};
        const over = overrides[bid] || {};
        const type = over.type || base.type || 'normal';
        const hint = over.hint || base.hint || '';
        const short = over.short || base.short;
        const tall = over.tall || base.tall;
        const typeCls = {normal:'blk-normal',modified:'blk-modified',added:'blk-added',deleted:'blk-deleted',heading:'blk-heading',moved:'blk-moved',target:'blk-target'}[type] || 'blk-normal';
        const sizeCls = short ? 'block-short' : (tall ? 'block-tall' : '');
        return `<div class="block ${typeCls} ${sizeCls}" data-block="${bid}">
          <span class="block-id">${bid}</span>
          <span class="block-hint">${hint}</span>
        </div>`;
      }).join('');

      return `<div class="chunk-group ${statusCls}" data-chunk="${chunk.id}">
        <div class="chunk-blocks">${blocksHtml}</div>
        <span class="chunk-label">${label}</span>
      </div>`;
    }).join('');
  }

  bindEvents() {
    const p = this.panel;
    p.querySelector('[data-action="play"]').addEventListener('click', () => this.play());
    p.querySelector('[data-action="step"]').addEventListener('click', () => this.manualStep());
    p.querySelector('[data-action="reset"]').addEventListener('click', () => this.reset());
    p.querySelector('[data-speed]').addEventListener('change', e => {
      this.speed = parseFloat(e.target.value);
    });
  }

  delay(ms) {
    return new Promise(r => setTimeout(r, ms / this.speed));
  }

  updateProgress() {
    const pct = Math.min(100, Math.max(0, ((this.currentStep + 1) / this.totalSteps) * 100));
    const fill = this.panel.querySelector('[data-progress]');
    if (fill) fill.style.width = pct + '%';
    const label = this.panel.querySelector('[data-step-label]');
    if (label) {
      if (this.currentStep < 0) label.textContent = '▶ 클릭하여 시작';
      else if (this.currentStep >= this.totalSteps - 1) label.textContent = '✓ 완료';
      else label.textContent = `단계 ${this.currentStep + 1} / ${this.totalSteps}`;
    }
  }

  updateButtons() {
    const playBtn = this.panel.querySelector('[data-action="play"]');
    const stepBtn = this.panel.querySelector('[data-action="step"]');
    const resetBtn = this.panel.querySelector('[data-action="reset"]');
    const done = this.currentStep >= this.totalSteps - 1;

    if (this.playing) {
      playBtn.disabled = true;
      playBtn.textContent = '⏵ 재생 중...';
      stepBtn.disabled = true;
    } else if (done) {
      playBtn.disabled = true;
      playBtn.textContent = '✓ 완료';
      stepBtn.disabled = true;
    } else {
      playBtn.disabled = false;
      playBtn.textContent = this.currentStep >= 0 ? '▶ 이어서 재생' : '▶ 자동 재생';
      stepBtn.disabled = false;
    }
    resetBtn.disabled = this.currentStep < 0;
  }

  async play() {
    if (this.playing || this.currentStep >= this.totalSteps - 1) return;
    this.playing = true;
    this.updateButtons();

    while (this.currentStep < this.totalSteps - 1 && this.playing) {
      await this.executeNextStep();
      if (this.currentStep < this.totalSteps - 1) await this.delay(1400);
    }

    this.playing = false;
    this.updateButtons();
  }

  async manualStep() {
    if (this.playing || this.stepping || this.currentStep >= this.totalSteps - 1) return;
    this.stepping = true;
    this.updateButtons();
    await this.executeNextStep();
    this.stepping = false;
    this.updateButtons();
  }

  async executeNextStep() {
    this.currentStep++;
    this.updateProgress();
    this.updateButtons();

    const stepIdx = this.currentStep;
    const d = this.data;

    if (stepIdx === 0) {
      await this.animateScanIntro();
    } else if (stepIdx <= d.steps.length) {
      await this.animateProcessStep(stepIdx - 1, d.steps[stepIdx - 1]);
    } else {
      await this.showResult();
    }
  }

  async animateScanIntro() {
    const beforeRow = this.panel.querySelector('[data-blockrow="before"]');
    beforeRow.classList.add('scanning');

    await this.delay(600);
    const ce = this.panel.querySelector('[data-change-event]');
    ce.classList.add('visible');

    await this.delay(800);
    beforeRow.classList.remove('scanning');
  }

  async animateProcessStep(idx, step) {
    const entry = this.panel.querySelector(`[data-step="${idx}"]`);
    if (entry) {
      entry.classList.add('visible');
      entry.style.animation = 'fadeInUp .4s ease-out';
    }

    const beforeRow = this.panel.querySelector('[data-blockrow="before"]');
    const targets = step.targets || {};

    if (targets.blocks) {
      targets.blocks.forEach(bid => {
        const el = beforeRow.querySelector(`[data-block="${bid}"]`);
        if (el) {
          ['anim-pulse','anim-pulse-red','anim-pulse-green','anim-pulse-blue'].forEach(c => el.classList.remove(c));
          void el.offsetWidth;
          const animCls = step.anim?.includes('delete') ? 'anim-pulse-red' :
                          step.anim?.includes('add') ? 'anim-pulse-green' :
                          step.anim?.includes('move') ? 'anim-pulse-blue' : 'anim-pulse';
          el.classList.add(animCls);
        }
      });
    }

    if (targets.chunks) {
      targets.chunks.forEach(cid => {
        const el = beforeRow.querySelector(`[data-chunk="${cid}"]`);
        if (el) {
          el.classList.remove('anim-glow');
          void el.offsetWidth;
          el.classList.add('anim-glow');
          el.classList.remove('cg-keep');
          el.classList.add('cg-affected');
        }
      });
    }

    if (step.anim === 'dissolve-chunk' && targets.oldChunks) {
      targets.oldChunks.forEach(cid => {
        const el = beforeRow.querySelector(`[data-chunk="${cid}"]`);
        if (el) el.classList.add('anim-dissolve');
      });
      await this.delay(500);
    }

    if (step.anim === 'scan') {
      beforeRow.classList.add('scanning');
      await this.delay(1000);
      beforeRow.classList.remove('scanning');
    }

    if (step.anim === 'keep-rest') {
      const keepChunks = beforeRow.querySelectorAll('.cg-keep');
      keepChunks.forEach((el, i) => {
        setTimeout(() => {
          el.classList.remove('anim-pulse-blue');
          void el.offsetWidth;
          el.classList.add('anim-pulse-blue');
        }, i * 200);
      });
    }

    if (step.anim === 'group-break') {
      const affectedChunks = beforeRow.querySelectorAll('.cg-affected');
      affectedChunks.forEach(el => el.classList.add('anim-shake'));
      await this.delay(400);
    }

    if (step.anim === 'highlight-split') {
      const allAffected = beforeRow.querySelectorAll('.cg-affected');
      allAffected.forEach(el => {
        el.classList.remove('anim-glow');
        void el.offsetWidth;
        el.classList.add('anim-glow');
      });
    }

    await this.delay(300);
  }

  async showResult() {
    const arrow = this.panel.querySelector('[data-arrow]');
    arrow.classList.add('visible');
    await this.delay(400);

    const afterDiag = this.panel.querySelector('[data-diagram="after"]');
    afterDiag.style.opacity = '1';
    afterDiag.style.transform = 'translateY(0)';

    const afterRow = afterDiag.querySelector('[data-blockrow="after"]');
    const groups = afterRow.querySelectorAll('.chunk-group');
    for (const g of groups) {
      g.style.opacity = '0';
      g.style.transform = 'translateY(10px)';
    }

    for (let i = 0; i < groups.length; i++) {
      const g = groups[i];
      await this.delay(250);
      g.style.transition = 'all .5s ease';
      g.style.opacity = '1';
      g.style.transform = 'translateY(0)';

      if (g.classList.contains('cg-new')) g.classList.add('anim-pulse-green');
      else if (g.classList.contains('cg-rebuild')) g.classList.add('anim-pulse-purple');
      else if (g.classList.contains('cg-delete')) g.classList.add('anim-pulse-red');
    }

    await this.delay(600);

    const tmap = this.panel.querySelector('[data-tmap]');
    tmap.classList.add('visible');
    const flows = tmap.querySelectorAll('[data-tflow]');
    for (let i = 0; i < flows.length; i++) {
      await this.delay(250);
      flows[i].classList.add('visible');
    }

    await this.delay(400);
    const summary = this.panel.querySelector('[data-summary]');
    summary.classList.add('visible');

    this.updateButtons();
  }

  reset() {
    this.currentStep = -1;
    this.playing = false;
    this.stepping = false;
    this.render();
  }
}

const engines = {};
Object.keys(CASES).forEach(id => {
  engines[id] = new AnimEngine(id, CASES[id]);
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});
</script>
